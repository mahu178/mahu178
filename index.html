    <style>
        @keyframes DropIn {
            0% {
                transform: translateY(-100vh);
            }
            100% {
                transform: translateY(0);
            }
        }

        html[data-theme="dark"] {
            --frame-brightness: 100%;
        }
        html[data-theme="light"] {
            --frame-brightness: 0%;
        }
        body {
            width: 100vw;
            text-align: center;
            background-color: var(--bg);
        }

        h1 {
            font-size: min(45vw, 70vh);
            font-stretch: 50%;
            font-weight: 600;
            font-style: italic;
            line-height: 10%;
            background: transparent;
            animation: DropIn 0.5s ease-out;
        }

        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            box-sizing: border-box;
            margin: 0 min(3vw, 3vh);
            padding: 6vh 0;
        }

        #frame {
            --overlay-offset: min(3vw, 3vh);
            position: fixed;
            inset: 0;
            z-index: 9999;
            cursor: default;
            width: 100%;
            height: 100%;
            pointer-events: none;
            filter: brightness(var(--frame-brightness));
        }

        #frame span {
            position: absolute;
            display: block;
            background-repeat: no-repeat;
            background-size: 100% 100%;
        }

        #frame .corner {
            width: var(--overlay-offset);
            height: var(--overlay-offset);
            background-image: url(images/bg-corner.svg);
        }

        #frame .corner:nth-child(1) { top: var(--overlay-offset); left: var(--overlay-offset); }
        #frame .corner:nth-child(2) { top: var(--overlay-offset); right: var(--overlay-offset); transform: rotate(90deg); }
        #frame .corner:nth-child(3) { right: var(--overlay-offset); bottom: var(--overlay-offset); transform: rotate(180deg); }
        #frame .corner:nth-child(4) { bottom: var(--overlay-offset); left: var(--overlay-offset); transform: rotate(270deg); }

        #frame .side {
            width: var(--overlay-offset);
            height: var(--overlay-offset);
            background-image: url(images/bg-side.svg);
            transform-origin: center;
        }

        #frame .side:nth-child(5) {
            top: var(--overlay-offset);
            left: 50%;
            transform: translate(-50%, -50%);
        }

        #frame .side:nth-child(6) {
            top: 50%;
            right: var(--overlay-offset);
            transform: translate(50%, -50%) rotate(90deg);
        }

        #frame .side:nth-child(7) {
            bottom: var(--overlay-offset);
            left: 50%;
            transform: translate(-50%, 50%) rotate(180deg);
        }

        #frame .side:nth-child(8) {
            top: 50%;
            left: var(--overlay-offset);
            transform: translate(-50%, -50%) rotate(270deg);
        }
    </style>
</head>
